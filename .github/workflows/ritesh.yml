name: Generate Ritesh Contribution Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Ritesh grid SVG
        run: |
          mkdir -p dist
          cat > dist/ritesh.svg << 'EOF'
          <svg width="400" height="120" xmlns="http://www.w3.org/2000/svg">
            <rect width="400" height="120" fill="#0d1117"/>
            <g transform="translate(20,20)">
              <!-- Base grid (light grey cells) -->
              <g fill="#30363d">
                <!-- 20x7 grid -->
                <!-- You can add or reduce cells as needed -->
                <!-- Background -->
                <!-- vertical 0–19, horizontal 0–6 -->
                <!-- Generate manually for readability -->
                <!-- (We’ll just show a small section here) -->
                <!-- row 0 -->
                <rect x="0" y="0" width="10" height="10" rx="2" ry="2"/>
                <rect x="15" y="0" width="10" height="10" rx="2" ry="2"/>
                <rect x="30" y="0" width="10" height="10" rx="2" ry="2"/>
                <rect x="45" y="0" width="10" height="10" rx="2" ry="2"/>
                <rect x="60" y="0" width="10" height="10" rx="2" ry="2"/>
                <!-- ...repeat for full grid if desired -->
              </g>

              <!-- Dark grey “R” shape -->
              <g fill="#b0b0b0">
                <rect x="0" y="0" width="10" height="70"/>
                <rect x="15" y="0" width="20" height="10"/>
                <rect x="15" y="30" width="20" height="10"/>
                <rect x="35" y="15" width="10" height="15"/>
                <rect x="35" y="45" width="10" height="25"/>
                <animate attributeName="opacity" values="0;1;0.5;1" dur="4s" repeatCount="indefinite"/>
              </g>
            </g>
          </svg>
          EOF

      - name: Push generated SVG to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
